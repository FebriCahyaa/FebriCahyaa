name: Refresh Profile README

on:
  push:
    branches: [main, master]
  schedule:
    # Every 6 hours; GitHub Actions cron uses UTC (WIB = UTC+7).
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: false

      - name: Refresh profile metrics and latest Flux commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "chore(profile): refresh README data [skip ci]"
          git push
